name: Validar LEONIDA FILES — Dossier 34

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-dossier34.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-contract:
    name: Pruebas editoriales, datos y JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas de contrato y catálogos
        run: python -m unittest discover -s tests -v
      - name: Validar referencias y autoridad de fuentes
        run: python scripts/validate_catalog.py
      - name: Comprobar sintaxis del motor local
        run: node --check assets/js/dossier34.js
